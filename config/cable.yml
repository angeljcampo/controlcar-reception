# In development we use solid_cable on the primary DB (no `connects_to`,
# so it falls back to ActiveRecord::Base's connection). We avoid `async`
# (single-process only) and the `postgresql` adapter (LISTEN/NOTIFY caps
# payloads at 8 KB, which is too small for Turbo Stream broadcasts of the
# full AI analysis HTML — they were getting dropped silently).
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
