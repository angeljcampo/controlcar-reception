# In development we use solid_cable on the primary DB (no `connects_to`,
# so it falls back to ActiveRecord::Base's connection). We avoid `async`
# (single-process only) and the `postgresql` adapter (LISTEN/NOTIFY caps
# payloads at 8 KB, which is too small for Turbo Stream broadcasts of the
# full AI analysis HTML — they were getting dropped silently).
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

# Production uses Redis (the same instance Sidekiq uses) so Action Cable
# broadcasts work across processes (worker → web) without needing a
# dedicated cable DB. REDIS_URL is provided by Render's Key Value Store
# in runtime — we use ENV[] (not fetch) so the YAML parses cleanly during
# the Docker build (assets:precompile), when env vars aren't injected yet.
production:
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: controlcar_reception_production
