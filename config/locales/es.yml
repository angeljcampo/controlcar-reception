        # Virtual attrs forwarded to the underlying Vehicle by the create
        # service. Listed here so the form's f.label picks up the Spanish
        # text instead of "Make" / "Model" / "Year".
        make: "Marca"
        model: "Modelo"
        year: "Año"
      vehicle:
