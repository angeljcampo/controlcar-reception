          body: "Analizamos el historial del modelo contra el motivo de ingreso."
        quality:
          title: "Calidad pro"
          body: "Documentá cada detalle para asegurar la confianza del cliente."
        sync:
          title: "Sincro nube"
          body: "Toda la información se respalda instantáneamente."
    show:
      back_to_list: "Volver al listado"
