# Locale es-CL. Estructura:
# - number/date/time/errors.messages: formatos base de Rails
# - layouts.application: cadenas del layout (navbar, title)
# - helpers.label/submit: overrides para form helpers de Rails
# - work_orders.*: cadenas por acción (lazy lookup desde views/controllers)
# - activerecord.attributes: nombres de columnas para f.label sin texto
# - activerecord.errors.models: mensajes de error por modelo + atributo
# - enums.work_order: labels de enum values (priority, status)

es:
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
    currency:
      format:
        unit: "$"
        format: "%u%n"
        separator: ","
        delimiter: "."
        precision: 0

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y %H:%M"

  errors:
    messages:
      blank: "no puede estar vacío"
      taken: "ya está en uso"
      invalid: "no es válido"

  layouts:
    application:
      full_title: "Controlcar — Recepción Inteligente"
      app_short: "Controlcar"
      app_tagline: "/ Recepción Inteligente"
      footer_tagline: "Controlcar Mecánica Inteligente"
      nav:
        work_orders: "Órdenes"
        sidekiq: "Sidekiq"
      footer:
        support: "Soporte"
        docs: "Documentación"
        privacy: "Privacidad"

  # Helpers Rails: f.submit sin texto y f.label override sólo cuando difiere
  # del nombre de atributo (caso photos: "Fotos del vehículo (opcional)").
  helpers:
    submit:
      work_order:
        create: "Guardar OT"
        update: "Actualizar OT"
    label:
      work_order:
        photos: "Fotos del vehículo (opcional)"

  work_orders:
