# Locale es-CL. Estructura:
# - number/date/time/errors.messages: formatos base de Rails
# - layouts.application: cadenas del layout (navbar, title)
# - helpers.label/submit: overrides para form helpers de Rails
# - work_orders.*: cadenas por acción (lazy lookup desde views/controllers)
# - activerecord.attributes: nombres de columnas para f.label sin texto
# - activerecord.errors.models: mensajes de error por modelo + atributo
# - enums.work_order: labels de enum values (priority, status)

es:
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
    currency:
      format:
        unit: "$"
        format: "%u%n"
        separator: ","
        delimiter: "."
        precision: 0

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y %H:%M"

  errors:
    messages:
      blank: "no puede estar vacío"
      taken: "ya está en uso"
      invalid: "no es válido"

  layouts:
    application:
      full_title: "Controlcar — Recepción Inteligente"
      app_short: "Controlcar"
      app_tagline: "/ Recepción Inteligente"
      nav:
        work_orders: "Órdenes"
        sidekiq: "Sidekiq"

  # Helpers Rails: f.submit sin texto y f.label override sólo cuando difiere
  # del nombre de atributo (caso photos: "Fotos del vehículo (opcional)").
  helpers:
    submit:
      work_order:
        create: "Guardar OT"
        update: "Actualizar OT"
    label:
      work_order:
        photos: "Fotos del vehículo (opcional)"

  work_orders:
    index:
      title: "Órdenes de trabajo"
      subtitle: "Recepción y diagnóstico inteligente de vehículos"
      new_button: "Nueva OT"
      empty:
        message: "Aún no hay órdenes de trabajo registradas."
        cta: "Crear la primera"
    new:
      title: "Nueva Orden de Trabajo"
      subtitle: "Registrá los datos del vehículo. La IA analizará el motivo después de guardar."
      back: "← Volver"
    show:
      back_to_list: "← Volver al listado"
      mileage_unit: "km"
      vehicle_heading: "Vehículo"
      entered_at_heading: "Ingresada"
      reason_heading: "Motivo de ingreso"
      photos_heading:
        one: "Fotos (%{count})"
        other: "Fotos (%{count})"
      ai_analysis_heading: "Análisis IA"
      ai_analysis_pending: "Pendiente. Se generará automáticamente cuando se cree la orden."
      ai_analysis_in_progress: "Analizando con IA"
      ai_analysis_in_progress_hint: "Buscando historial del vehículo y armando el diagnóstico..."
      reanalyze_button: "Re-analizar"
      agent_runs_toggle:
        one: "%{count} corrida del agente"
        other: "%{count} corridas del agente"
      agent_runs_loading: "Cargando corridas..."
    # Strings consumidas por app/views/work_orders/_ai_analysis.html.erb.
    # Rails lazy lookup en partials usa `work_orders.ai_analysis.<key>`.
    ai_analysis:
      category_label: "Categoría"
      suggested_priority_label: "Prioridad sugerida"
      priority_reason_label: "Razón"
      confidence_label: "Confianza"
      review_banner_title: "Revisión humana sugerida"
      review_banner_text: "Los síntomas son ambiguos o la confianza es baja. Conviene que un mecánico revise antes de actuar."
      possible_failures_heading: "Posibles fallas"
      next_steps_heading: "Próximos pasos"
      required_tool_prefix: "con"
      sources_heading: "Fuentes consultadas"
      observations_heading: "Observaciones"
      footer_model: "Modelo"
      footer_tokens: "tokens"
      footer_latency: "ms"
    stats_strip:
      tokens: "tokens consumidos"
      runs:
        one: "corrida"
        other: "corridas"
      last_run: "Última"
    form:
      patente_placeholder: "Ej: ABCD-12"
      reason_placeholder: "Ej: Vehículo tirita en ralentí y prende la luz de check engine al acelerar"
      reason_hint: "Describí los síntomas con tus propias palabras. La IA va a usar este texto para diagnosticar."
      photos_hint: "Adjuntá fotos de daños visibles, tablero o cualquier detalle relevante."
      errors_heading:
        one: "Se encontró %{count} error:"
        other: "Se encontraron %{count} errores:"
      cancel: "Cancelar"
    create:
      success: "Orden de trabajo creada correctamente. Iniciando análisis con IA."
    reanalyze:
      queued: "Re-análisis encolado. Los resultados van a aparecer acá en unos segundos."

  agent_runs:
    index:
      empty: "Aún no hay corridas registradas."
    status:
      succeeded: "Exitosa"
      failed: "Fallida"
      running: "En curso"

  activerecord:
    attributes:
      work_order:
        patente: "Patente"
        customer_name: "Nombre del cliente"
        mileage: "Kilometraje"
        reason: "Motivo de ingreso"
        priority: "Prioridad"
        photos: "Fotos"
        created_at: "Ingresada"
      vehicle:
        patente: "Patente"
        make: "Marca"
        model: "Modelo"
        year: "Año"
    errors:
      models:
        work_order:
          attributes:
            patente:
              blank: "no puede estar vacía"

  enums:
    work_order:
      priority:
        low: "Baja"
        medium: "Media"
        high: "Alta"
        critical: "Crítica"
      status:
        draft: "Borrador"
        analyzing: "Analizando"
        analyzed: "Analizado"
        in_review: "En revisión"
    ai_analysis:
      category:
        engine: "Motor"
        transmission: "Transmisión"
        brakes: "Frenos"
        suspension: "Suspensión"
        electrical: "Sistema eléctrico"
        cooling: "Refrigeración"
        fuel: "Combustible"
        exhaust: "Escape"
        tires: "Neumáticos"
        body: "Carrocería"
        diagnosis_needed: "Diagnóstico necesario"
        other: "Otro"
      probability:
        high: "Alta"
        medium: "Media"
        low: "Baja"
